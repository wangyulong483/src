    - 0.0
    - -2.8
    max_accel:
    - 1.5
    - 0.0
    - 2.5
    max_decel:
    - -1.8
    - 0.0
    - -2.5
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 1.0
robot_state_publisher:
  ros__parameters:
